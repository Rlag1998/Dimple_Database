name: Deploy Dynasty to GitHub Pages

# Rebuilds the compact data artifacts from population.json and deploys the site.
# Requires Pages "Source: GitHub Actions" (Settings -> Pages) enabled once by an
# admin — GitHub's built-in token cannot bootstrap Pages on the first run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build data artifacts (if population.json is present)
        run: |
          if [ -f population.json ]; then
            python3 build.py population.json --out data
          else
            echo "No population.json committed — deploying pre-built data/ as-is."
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Package site
        run: |
          mkdir -p _site
          cp -r index.html styles.css js data .nojekyll _site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
